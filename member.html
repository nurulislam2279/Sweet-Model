<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet-Model Member</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
    }

    .logout-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .search-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
    }

    .reels {
      display: grid;
      gap: 15px;
    }

    .reel-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .reel-card h3 {
      margin-bottom: 8px;
    }

    .reel-card p {
      color: #6b7280;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .view-btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      color: #6b7280;
      border-radius: 12px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .container {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 Sweet-Model</h1>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </header>

  <div class="container">

    <div class="welcome">
      <h2>Welcome Member 👋</h2>
      <p id="userEmail">Loading...</p>
    </div>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search reels..."
      >
    </div>

    <div id="reelsContainer" class="reels">
      <div class="loading">Loading reels...</div>
    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyD15DDy67p9Sk68zBOCO2yA8orRt69vMVQ",
      authDomain: "sweet-model.firebaseapp.com",
      projectId: "sweet-model",
      storageBucket: "sweet-model.firebasestorage.app",
      messagingSenderId: "977088623623",
      appId: "1:977088623623:web:561067fe266809b1a466a2",
      measurementId: "G-05EK5P5S8J"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    const reelsContainer =
      document.getElementById("reelsContainer");

    const searchInput =
      document.getElementById("searchInput");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const userEmail =
      document.getElementById("userEmail");


    let allReels = [];


    // Check logged-in member
    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        window.location.href = "index.html";
        return;
      }


      userEmail.textContent = user.email;


      try {

        const userDoc = await getDoc(
          doc(db, "users", user.uid)
        );


        if (!userDoc.exists() ||
            userDoc.data().role !== "member") {

          alert("Access denied. Member account required.");

          await signOut(auth);

          window.location.href = "index.html";

          return;
        }


        loadReels();

      } catch (error) {

        console.error(error);

        alert("Unable to verify member account.");

        await signOut(auth);

        window.location.href = "index.html";
      }

    });


    // Load reels from Firestore
    function loadReels() {

      onSnapshot(
        collection(db, "reels"),
        (snapshot) => {

          allReels = [];


          snapshot.forEach((docSnapshot) => {

            allReels.push({
              id: docSnapshot.id,
              ...docSnapshot.data()
            });

          });


          displayReels(allReels);

        },
        (error) => {

          console.error(error);

          reelsContainer.innerHTML =
            '<div class="empty">Unable to load reels.</div>';

        }
      );

    }


    // Display reels
    function displayReels(reels) {

      reelsContainer.innerHTML = "";


      if (reels.length === 0) {

        reelsContainer.innerHTML =
          '<div class="empty">No reels available yet.</div>';

        return;
      }


      reels.forEach((reel) => {

        const card =
          document.createElement("div");

        card.className = "reel-card";


        const title =
          document.createElement("h3");

        title.textContent =
          reel.title || "Untitled Reel";


        const description =
          document.createElement("p");

        description.textContent =
          reel.description || "No description available.";


        const viewBtn =
          document.createElement("button");

        viewBtn.className = "view-btn";

        viewBtn.textContent = "View Reel";


        viewBtn.addEventListener("click", () => {

          alert(
            "Reel: " +
            (reel.title || "Untitled Reel")
          );

        });


        card.appendChild(title);

        card.appendChild(description);

        card.appendChild(viewBtn);

        reelsContainer.appendChild(card);

      });

    }


    // Search
    searchInput.addEventListener("input", () => {

      const searchText =
        searchInput.value.toLowerCase().trim();


      const filteredReels =
        allReels.filter((reel) => {

          const title =
            (reel.title || "").toLowerCase();

          const description =
            (reel.description || "").toLowerCase();


          return (
            title.includes(searchText) ||
            description.includes(searchText)
          );

        });


      displayReels(filteredReels);

    });


    // Logout
    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

        window.location.href = "index.html";

      } catch (error) {

        console.error(error);

      }

    });

  </script>

</body>
</html>
