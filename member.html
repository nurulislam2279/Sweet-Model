```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Member Dashboard - Sweet-Model</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f3f4f6;
      color: #111827;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
    }

    .logout-btn {
      border: none;
      background: #ef4444;
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    /* Main */
    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .welcome {
      background: white;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .welcome h1 {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .welcome p {
      color: #6b7280;
    }

    /* Search */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .search-box input {
      flex: 1;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .search-box button {
      border: none;
      background: #6366f1;
      color: white;
      padding: 0 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Section */
    .section-title {
      font-size: 21px;
      margin-bottom: 15px;
    }

    /* Reels */
    .reels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .reel-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .reel-video {
      width: 100%;
      height: 350px;
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 45px;
    }

    .reel-info {
      padding: 15px;
    }

    .reel-info h3 {
      margin-bottom: 7px;
    }

    .reel-info p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .view-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .view-btn:hover {
      background: #4f46e5;
    }

    /* Empty */
    .empty {
      display: none;
      text-align: center;
      background: white;
      padding: 40px 20px;
      border-radius: 15px;
      color: #6b7280;
    }

    /* Mobile */
    @media (max-width: 800px) {
      .reels-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .reel-video {
        height: 300px;
      }
    }

    @media (max-width: 550px) {
      .reels-grid {
        grid-template-columns: 1fr;
      }

      .reel-video {
        height: 420px;
      }

      .search-box {
        flex-direction: column;
      }

      .search-box button {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <div class="brand">🎬 Sweet-Model</div>

    <button class="logout-btn" onclick="logout()">
      Logout
    </button>
  </header>

  <!-- Main -->
  <main>

    <div class="welcome">
      <h1>Welcome, Member 👋</h1>
      <p>Browse and manage your Reels from your dashboard.</p>
    </div>

    <!-- Search -->
    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search reels..."
        onkeyup="searchReels()"
      >

      <button onclick="searchReels()">
        Search
      </button>
    </div>

    <h2 class="section-title">
      Latest Reels
    </h2>

    <!-- Reels -->
    <div class="reels-grid" id="reelsGrid">

      <div class="reel-card" data-title="Welcome Reel">

        <div class="reel-video">
          🎬
        </div>

        <div class="reel-info">
          <h3>Welcome Reel</h3>

          <p>
            Welcome to Sweet-Model.
          </p>

          <button
            class="view-btn"
            onclick="viewReel('Welcome Reel')">
            View Reel
          </button>
        </div>

      </div>


      <div class="reel-card" data-title="Sweet Model Reel">

        <div class="reel-video">
          🎥
        </div>

        <div class="reel-info">
          <h3>Sweet Model Reel</h3>

          <p>
            Latest Sweet-Model content.
          </p>

          <button
            class="view-btn"
            onclick="viewReel('Sweet Model Reel')">
            View Reel
          </button>
        </div>

      </div>


      <div class="reel-card" data-title="New Reel">

        <div class="reel-video">
          📱
        </div>

        <div class="reel-info">
          <h3>New Reel</h3>

          <p>
            New reel will appear here.
          </p>

          <button
            class="view-btn"
            onclick="viewReel('New Reel')">
            View Reel
          </button>
        </div>

      </div>

    </div>

    <div class="empty" id="emptyMessage">
      No reels found.
    </div>

  </main>


  <script>

    /* Search Reels */
    function searchReels() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();

      const cards =
        document.querySelectorAll(".reel-card");

      let found = false;

      cards.forEach(function(card) {

        const title =
          card
            .getAttribute("data-title")
            .toLowerCase();

        if (title.includes(search)) {

          card.style.display = "block";
          found = true;

        } else {

          card.style.display = "none";

        }

      });

      document.getElementById("emptyMessage")
        .style.display = found ? "none" : "block";
    }


    /* View Reel */
    function viewReel(title) {

      alert(
        "Opening: " + title +
        "\n\nReal video player will be connected next."
      );

    }


    /* Logout */
    function logout() {

      const confirmLogout =
        confirm("Are you sure you want to logout?");

      if (confirmLogout) {

        window.location.href = "index.html";

      }

    }

  </script>

</body>
</html>
```
