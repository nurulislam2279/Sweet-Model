<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet-Model - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #4f46e5);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .roles {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .role-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #4f46e5;
      background: white;
      color: #4f46e5;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .role-btn.active {
      background: #4f46e5;
      color: white;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #dc2626;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>🎬 Sweet-Model</h1>
    <p class="subtitle">Reels Management App</p>

    <div class="roles">
      <button class="role-btn active" id="memberBtn">Member</button>
      <button class="role-btn" id="adminBtn">Admin</button>
    </div>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="login-btn" id="loginBtn">
      Login
    </button>

    <div id="message"></div>
  </div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD15DDy67p9Sk68zBOCO2yA8orRt69vMVQ",
      authDomain: "sweet-model.firebaseapp.com",
      projectId: "sweet-model",
      storageBucket: "sweet-model.firebasestorage.app",
      messagingSenderId: "977088623623",
      appId: "1:977088623623:web:561067fe266809b1a466a2",
      measurementId: "G-05EK5P5S8J"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    let selectedRole = "member";


    const memberBtn = document.getElementById("memberBtn");
    const adminBtn = document.getElementById("adminBtn");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");


    // Role selection
    memberBtn.addEventListener("click", () => {
      selectedRole = "member";

      memberBtn.classList.add("active");
      adminBtn.classList.remove("active");

      message.textContent = "";
    });


    adminBtn.addEventListener("click", () => {
      selectedRole = "admin";

      adminBtn.classList.add("active");
      memberBtn.classList.remove("active");

      message.textContent = "";
    });


    // Login
    loginBtn.addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;


      if (!email || !password) {
        message.textContent = "Please enter email and password.";
        return;
      }


      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";
      message.textContent = "";


      try {

        const userCredential =
          await signInWithEmailAndPassword(auth, email, password);

        const user = userCredential.user;


        // Get user's role from Firestore
        const userDoc = await getDoc(
          doc(db, "users", user.uid)
        );


        if (!userDoc.exists()) {

          message.textContent =
            "User role not found.";

          await auth.signOut();

          loginBtn.disabled = false;
          loginBtn.textContent = "Login";

          return;
        }


        const userData = userDoc.data();
        const actualRole = userData.role;


        // Check selected role
        if (actualRole !== selectedRole) {

          message.textContent =
            "Wrong role selected.";

          await auth.signOut();

          loginBtn.disabled = false;
          loginBtn.textContent = "Login";

          return;
        }


        // Redirect
        if (actualRole === "admin") {

          window.location.href = "admin.html";

        } else if (actualRole === "member") {

          window.location.href = "member.html";

        }

      } catch (error) {

        console.error(error);

        if (error.code === "auth/invalid-credential") {
          message.textContent =
            "Email or password is incorrect.";
        } else if (error.code === "auth/invalid-email") {
          message.textContent =
            "Please enter a valid email.";
        } else {
          message.textContent =
            "Login failed. Please try again.";
        }

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }

    });

  </script>

</body>
  </html>
