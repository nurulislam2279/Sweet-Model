<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet-Model</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #29256b, #5148e5);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 25px;
      padding: 35px 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      text-align: center;
    }

    .logo {
      font-size: 45px;
    }

    h1 {
      margin: 5px 0;
      color: #171b2b;
      font-size: 36px;
    }

    .subtitle {
      color: #777;
      font-size: 20px;
      margin-bottom: 30px;
    }

    .role-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .role-btn {
      flex: 1;
      padding: 16px;
      border-radius: 15px;
      border: 2px solid #5148e5;
      background: white;
      color: #5148e5;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .role-btn.active {
      background: #5148e5;
      color: white;
    }

    input {
      width: 100%;
      padding: 17px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 15px;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: #5148e5;
    }

    .main-btn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 15px;
      background: #5148e5;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .register-link {
      margin-top: 22px;
      color: #555;
      font-size: 16px;
    }

    .register-link button {
      border: none;
      background: none;
      color: #5148e5;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .back-btn {
      border: none;
      background: none;
      color: #5148e5;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    #message {
      margin-top: 18px;
      color: #d32f2f;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div class="box" id="loginBox">

    <div class="logo">🎬</div>
    <h1>Sweet-Model</h1>
    <div class="subtitle">Reels Management App</div>

    <div class="role-buttons">
      <button class="role-btn active" id="memberLoginBtn">
        Member
      </button>

      <button class="role-btn" id="adminLoginBtn">
        Admin
      </button>
    </div>

    <input
      type="email"
      id="loginEmail"
      placeholder="Email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <button class="main-btn" id="loginBtn">
      Login
    </button>

    <div class="register-link">
      Don't have an account?
      <button id="showRegisterBtn">
        Register Account
      </button>
    </div>

    <div id="loginMessage"></div>

  </div>


  <!-- REGISTER -->
  <div class="box hidden" id="registerBox">

    <div class="logo">📝</div>

    <h1>Create Account</h1>

    <div class="subtitle">
      Sweet-Model Member Registration
    </div>

    <input
      type="text"
      id="registerName"
      placeholder="Full Name"
    >

    <input
      type="email"
      id="registerEmail"
      placeholder="Email"
    >

    <input
      type="password"
      id="registerPassword"
      placeholder="Password"
    >

    <input
      type="password"
      id="registerConfirmPassword"
      placeholder="Confirm Password"
    >

    <button class="main-btn" id="registerBtn">
      Register
    </button>

    <button class="back-btn" id="backLoginBtn">
      ← Back to Login
    </button>

    <div id="registerMessage"></div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // Firebase Configuration
    const firebaseConfig = {

      /*
       IMPORTANT:
       এখানে আপনার আগের index.html-এর
       apiKey বসাবেন।
      */
      apiKey: "AIzaSyD15DDy67p9Sk68zBOCO2yA8orRt69vMVQ",

      authDomain: "sweet-model.firebaseapp.com",

      projectId: "sweet-model",

      storageBucket: "sweet-model.firebasestorage.app",

      messagingSenderId: "977088623623",

      appId: "1:977088623623:web:561067fe266809b1a466a2",

      measurementId: "G-05EK5P5S8J"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    let selectedLoginRole = "member";


    // Elements
    const loginBox = document.getElementById("loginBox");
    const registerBox = document.getElementById("registerBox");

    const memberLoginBtn =
      document.getElementById("memberLoginBtn");

    const adminLoginBtn =
      document.getElementById("adminLoginBtn");

    const showRegisterBtn =
      document.getElementById("showRegisterBtn");

    const backLoginBtn =
      document.getElementById("backLoginBtn");

    const loginBtn =
      document.getElementById("loginBtn");

    const registerBtn =
      document.getElementById("registerBtn");


    // Login role selection

    memberLoginBtn.addEventListener("click", () => {

      selectedLoginRole = "member";

      memberLoginBtn.classList.add("active");

      adminLoginBtn.classList.remove("active");
    });


    adminLoginBtn.addEventListener("click", () => {

      selectedLoginRole = "admin";

      adminLoginBtn.classList.add("active");

      memberLoginBtn.classList.remove("active");
    });


    // Show Register

    showRegisterBtn.addEventListener("click", () => {

      loginBox.classList.add("hidden");

      registerBox.classList.remove("hidden");

      document.getElementById("registerMessage").textContent = "";
    });


    // Back to Login

    backLoginBtn.addEventListener("click", () => {

      registerBox.classList.add("hidden");

      loginBox.classList.remove("hidden");

      document.getElementById("loginMessage").textContent = "";
    });


    // LOGIN

    loginBtn.addEventListener("click", async () => {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const message =
        document.getElementById("loginMessage");


      message.textContent = "";


      if (!email || !password) {

        message.textContent =
          "Please enter email and password.";

        return;
      }


      try {

        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user = userCredential.user;


        const userDoc =
          await getDoc(
            doc(db, "users", user.uid)
          );


        if (!userDoc.exists()) {

          message.textContent =
            "User role not found.";

          return;
        }


        const role =
          userDoc.data().role;


        if (role !== selectedLoginRole) {

          message.textContent =
            "Wrong account type.";

          return;
        }


        if (role === "admin") {

          window.location.href = "admin.html";

        } else {

          window.location.href = "member.html";

        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Login failed: " + error.message;
      }

    });


    // REGISTER MEMBER

    registerBtn.addEventListener("click", async () => {

      const name =
        document.getElementById("registerName").value.trim();

      const email =
        document.getElementById("registerEmail").value.trim();

      const password =
        document.getElementById("registerPassword").value;

      const confirmPassword =
        document.getElementById("registerConfirmPassword").value;

      const message =
        document.getElementById("registerMessage");


      message.textContent = "";


      if (!name || !email || !password || !confirmPassword) {

        message.textContent =
          "Please fill in all fields.";

        return;
      }


      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        return;
      }


      if (password !== confirmPassword) {

        message.textContent =
          "Passwords do not match.";

        return;
      }


      try {

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        await setDoc(
          doc(db, "users", user.uid),
          {
            name: name,
            email: email,
            role: "member"
          }
        );


        message.style.color = "green";

        message.textContent =
          "Account created successfully!";


        setTimeout(() => {

          window.location.href = "member.html";

        }, 1200);


      } catch (error) {

        console.error(error);

        message.style.color = "#d32f2f";

        message.textContent =
          "Registration failed: " + error.message;
      }

    });

  </script>

</body>
</html>
