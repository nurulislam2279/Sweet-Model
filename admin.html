<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet-Model Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout {
      background: #dc2626;
      color: white;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 28px;
    }

    h3 {
      font-size: 24px;
      margin-top: 0;
    }

    .stats {
      text-align: center;
      font-size: 20px;
    }

    .stat-number {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .primary {
      width: 100%;
      background: #4f46e5;
      color: white;
    }

    .request {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .request strong {
      font-size: 18px;
    }

    .status {
      display: inline-block;
      margin: 8px 0;
      padding: 6px 10px;
      border-radius: 8px;
      background: #fef3c7;
      color: #92400e;
      font-weight: bold;
    }

    .approve {
      background: #16a34a;
      color: white;
      margin-right: 8px;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .delete {
      background: #dc2626;
      color: white;
      margin-top: 10px;
    }

    .reel {
      border-bottom: 1px solid #e5e7eb;
      padding: 15px 0;
    }

    .reel:last-child {
      border-bottom: none;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }

    .empty {
      color: #6b7280;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>🎬 Sweet-Model Admin</h1>
  <button class="logout" id="logoutBtn">Logout</button>
</header>

<main>

  <div class="card">
    <h2>Welcome Admin 👋</h2>
    <p>Manage your Sweet-Model reels and admin requests from here.</p>
  </div>

  <div class="card stats">
    <div class="stat-number" id="reelCount">0</div>
    <div>Total Reels</div>
  </div>

  <!-- ADMIN REQUESTS -->
  <div class="card">
    <h3>👑 Admin Requests</h3>
    <div id="requestList">
      <div class="empty">Loading requests...</div>
    </div>
  </div>

  <!-- ADD REEL -->
  <div class="card">
    <h3>➕ Add New Reel</h3>

    <input
      type="text"
      id="reelTitle"
      placeholder="Reel title"
    >

    <textarea
      id="reelDescription"
      placeholder="Reel description"
    ></textarea>

    <button class="primary" id="addReelBtn">
      Add Reel
    </button>

    <div class="message" id="reelMessage"></div>
  </div>

  <!-- MANAGE REELS -->
  <div class="card">
    <h3>📋 Manage Reels</h3>
    <div id="reelList">
      <div class="empty">Loading reels...</div>
    </div>
  </div>

</main>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    collection,
    addDoc,
    deleteDoc,
    updateDoc,
    onSnapshot,
    serverTimestamp,
    writeBatch
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyD15DDy67p9Sk68zBOCO2yA8orRt69vMVQ",
    authDomain: "sweet-model.firebaseapp.com",
    projectId: "sweet-model",
    storageBucket: "sweet-model.firebasestorage.app",
    messagingSenderId: "977088623623",
    appId: "1:977088623623:web:561067fe266809b1a466a2",
    measurementId: "G-05EK5P5S8J"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  const reelList = document.getElementById("reelList");
  const reelCount = document.getElementById("reelCount");
  const requestList = document.getElementById("requestList");

  const reelTitle = document.getElementById("reelTitle");
  const reelDescription = document.getElementById("reelDescription");

  const addReelBtn = document.getElementById("addReelBtn");
  const reelMessage = document.getElementById("reelMessage");

  const logoutBtn = document.getElementById("logoutBtn");


  // =========================
  // CHECK ADMIN LOGIN
  // =========================

  onAuthStateChanged(auth, async (user) => {

    if (!user) {
      window.location.href = "index.html";
      return;
    }

    try {

      const userRef = doc(db, "users", user.uid);

      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        alert("User profile not found.");
        await signOut(auth);
        window.location.href = "index.html";
        return;
      }

      const userData = userSnap.data();

      if (userData.role !== "admin") {
        alert("Access denied. Admin only.");
        await signOut(auth);
        window.location.href = "index.html";
        return;
      }

      // Admin verified
      loadReels();
      loadAdminRequests();

    } catch (error) {

      console.error(error);

      alert("Admin verification failed: " + error.message);

    }

  });


  // =========================
  // LOAD REELS
  // =========================

  function loadReels() {

    const reelsRef = collection(db, "reels");

    onSnapshot(reelsRef, (snapshot) => {

      reelCount.textContent = snapshot.size;

      if (snapshot.empty) {

        reelList.innerHTML =
          '<div class="empty">No reels added yet.</div>';

        return;
      }

      reelList.innerHTML = "";

      snapshot.forEach((reelDoc) => {

        const reel = reelDoc.data();

        const div = document.createElement("div");

        div.className = "reel";

        div.innerHTML = `
          <h3>${escapeHtml(reel.title || "Untitled Reel")}</h3>

          <p>${escapeHtml(reel.description || "")}</p>

          <button
            class="delete"
            data-id="${reelDoc.id}">
            Delete
          </button>
        `;

        reelList.appendChild(div);

      });


      document.querySelectorAll(".delete").forEach((button) => {

        button.addEventListener("click", async () => {

          const id = button.dataset.id;

          if (!confirm("Are you sure you want to delete this reel?")) {
            return;
          }

          try {

            await deleteDoc(doc(db, "reels", id));

          } catch (error) {

            alert("Delete failed: " + error.message);

          }

        });

      });

    });

  }


  // =========================
  // ADD REEL
  // =========================

  addReelBtn.addEventListener("click", async () => {

    const title = reelTitle.value.trim();

    const description = reelDescription.value.trim();

    if (!title) {

      alert("Please enter a reel title.");

      return;
    }

    try {

      await addDoc(collection(db, "reels"), {

        title: title,

        description: description,

        createdAt: serverTimestamp()

      });

      reelTitle.value = "";

      reelDescription.value = "";

      reelMessage.textContent = "Reel added successfully.";

    } catch (error) {

      reelMessage.textContent =
        "Failed to add reel: " + error.message;

    }

  });


  // =========================
  // LOAD ADMIN REQUESTS
  // =========================

  function loadAdminRequests() {

    const requestsRef = collection(db, "adminRequests");

    onSnapshot(requestsRef, (snapshot) => {

      const requests = [];

      snapshot.forEach((requestDoc) => {

        requests.push({
          id: requestDoc.id,
          ...requestDoc.data()
        });

      });


      if (requests.length === 0) {

        requestList.innerHTML =
          '<div class="empty">No admin requests.</div>';

        return;
      }


      // Newest first
      requests.sort((a, b) => {

        const dateA = new Date(a.createdAt || 0);

        const dateB = new Date(b.createdAt || 0);

        return dateB - dateA;

      });


      requestList.innerHTML = "";


      requests.forEach((request) => {

        const div = document.createElement("div");

        div.className = "request";

        const status = request.status || "pending";

        let buttons = "";

        if (status === "pending") {

          buttons = `
            <button
              class="approve"
              data-id="${request.id}"
              data-uid="${request.uid}">
              Approve
            </button>

            <button
              class="reject"
              data-id="${request.id}">
              Reject
            </button>
          `;

        }


        div.innerHTML = `

          <strong>
            ${escapeHtml(request.name || "No name")}
          </strong>

          <p>
            Email:
            ${escapeHtml(request.email || "Not provided")}
          </p>

          <p>
            Method:
            ${escapeHtml(request.method || "Unknown")}
          </p>

          <span class="status">
            ${escapeHtml(status)}
          </span>

          <div>
            ${buttons}
          </div>

        `;

        requestList.appendChild(div);

      });


      // APPROVE
      document.querySelectorAll(".approve").forEach((button) => {

        button.addEventListener("click", async () => {

          const requestId = button.dataset.id;

          const uid = button.dataset.uid;

          if (!confirm("Approve this user as Admin?")) {
            return;
          }

          try {

            const batch = writeBatch(db);

            // Change user role to admin
            batch.update(
              doc(db, "users", uid),
              {
                role: "admin"
              }
            );

            // Mark request approved
            batch.update(
              doc(db, "adminRequests", requestId),
              {
                status: "approved",
                updatedAt: serverTimestamp()
              }
            );

            await batch.commit();

            alert("Admin request approved successfully.");

          } catch (error) {

            alert(
              "Approval failed: " + error.message
            );

          }

        });

      });


      // REJECT
      document.querySelectorAll(".reject").forEach((button) => {

        button.addEventListener("click", async () => {

          const requestId = button.dataset.id;

          if (!confirm("Reject this admin request?")) {
            return;
          }

          try {

            await updateDoc(
              doc(db, "adminRequests", requestId),
              {
                status: "rejected",
                updatedAt: serverTimestamp()
              }
            );

            alert("Admin request rejected.");

          } catch (error) {

            alert(
              "Rejection failed: " + error.message
            );

          }

        });

      });

    });

  }


  // =========================
  // LOGOUT
  // =========================

  logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

    window.location.href = "index.html";

  });


  // =========================
  // SECURITY DISPLAY HELPER
  // =========================

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
  </html>
