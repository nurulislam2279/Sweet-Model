<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet-Model Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
    }

    .logout-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stat h2 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .stat p {
      color: #6b7280;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 15px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .add-btn {
      width: 100%;
      padding: 13px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:disabled {
      opacity: 0.6;
    }

    .reel {
      border: 1px solid #e5e7eb;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .reel h3 {
      margin-bottom: 7px;
    }

    .reel p {
      color: #6b7280;
      margin-bottom: 12px;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 13px;
      border-radius: 7px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 20px;
    }

    #message {
      margin-top: 12px;
      text-align: center;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 Sweet-Model Admin</h1>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </header>

  <div class="container">

    <div class="welcome">
      <h2>Welcome Admin 👋</h2>
      <p>Manage your Sweet-Model reels from here.</p>
    </div>

    <div class="stats">

      <div class="stat">
        <h2 id="totalReels">0</h2>
        <p>Total Reels</p>
      </div>

      <div class="stat">
        <h2>1</h2>
        <p>Admin</p>
      </div>

      <div class="stat">
        <h2>Online</h2>
        <p>System Status</p>
      </div>

    </div>

    <div class="card">

      <h2>➕ Add New Reel</h2>

      <input
        type="text"
        id="reelTitle"
        placeholder="Reel title"
      >

      <textarea
        id="reelDescription"
        placeholder="Reel description"
      ></textarea>

      <button class="add-btn" id="addReelBtn">
        Add Reel
      </button>

      <div id="message"></div>

    </div>

    <div class="card">

      <h2>📋 Manage Reels</h2>

      <div id="reelsList">
        <div class="empty">Loading reels...</div>
      </div>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      addDoc,
      deleteDoc,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyD15DDy67p9Sk68zBOCO2yA8orRt69vMVQ",
      authDomain: "sweet-model.firebaseapp.com",
      projectId: "sweet-model",
      storageBucket: "sweet-model.firebasestorage.app",
      messagingSenderId: "977088623623",
      appId: "1:977088623623:web:561067fe266809b1a466a2",
      measurementId: "G-05EK5P5S8J"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    const reelsList = document.getElementById("reelsList");
    const totalReels = document.getElementById("totalReels");
    const addReelBtn = document.getElementById("addReelBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const message = document.getElementById("message");


    let isAdmin = false;


    // Check logged-in user
    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        window.location.href = "index.html";
        return;
      }


      try {

        const userDoc = await getDoc(
          doc(db, "users", user.uid)
        );


        if (!userDoc.exists() ||
            userDoc.data().role !== "admin") {

          alert("Access denied. Admin only.");

          await signOut(auth);

          window.location.href = "index.html";

          return;
        }


        isAdmin = true;

        loadReels();

      } catch (error) {

        console.error(error);

        alert("Unable to verify admin account.");

        await signOut(auth);

        window.location.href = "index.html";
      }

    });


    // Load reels
    function loadReels() {

      onSnapshot(
        collection(db, "reels"),
        (snapshot) => {

          reelsList.innerHTML = "";

          totalReels.textContent = snapshot.size;


          if (snapshot.empty) {

            reelsList.innerHTML =
              '<div class="empty">No reels added yet.</div>';

            return;
          }


          snapshot.forEach((docSnapshot) => {

            const reel = docSnapshot.data();

            const reelDiv = document.createElement("div");

            reelDiv.className = "reel";


            const title = document.createElement("h3");

            title.textContent =
              reel.title || "Untitled Reel";


            const description = document.createElement("p");

            description.textContent =
              reel.description || "";


            const deleteBtn =
              document.createElement("button");

            deleteBtn.className = "delete-btn";

            deleteBtn.textContent = "Delete";


            deleteBtn.addEventListener("click", () => {

              deleteReel(docSnapshot.id);

            });


            reelDiv.appendChild(title);

            reelDiv.appendChild(description);

            reelDiv.appendChild(deleteBtn);

            reelsList.appendChild(reelDiv);

          });

        },
        (error) => {

          console.error(error);

          reelsList.innerHTML =
            '<div class="empty">Unable to load reels.</div>';

        }
      );

    }


    // Add reel
    addReelBtn.addEventListener("click", async () => {

      if (!isAdmin) {
        return;
      }


      const title =
        document.getElementById("reelTitle").value.trim();

      const description =
        document.getElementById("reelDescription").value.trim();


      if (!title) {

        message.textContent =
          "Please enter a reel title.";

        return;
      }


      addReelBtn.disabled = true;

      addReelBtn.textContent = "Adding...";

      message.textContent = "";


      try {

        await addDoc(
          collection(db, "reels"),
          {
            title: title,
            description: description,
            createdAt: serverTimestamp()
          }
        );


        document.getElementById("reelTitle").value = "";

        document.getElementById("reelDescription").value = "";

        message.textContent =
          "Reel added successfully!";


      } catch (error) {

        console.error(error);

        message.textContent =
          "Failed to add reel.";

      }


      addReelBtn.disabled = false;

      addReelBtn.textContent = "Add Reel";

    });


    // Delete reel
    async function deleteReel(reelId) {

      if (!isAdmin) {
        return;
      }


      const confirmed =
        confirm("Are you sure you want to delete this reel?");


      if (!confirmed) {
        return;
      }


      try {

        await deleteDoc(
          doc(db, "reels", reelId)
        );

      } catch (error) {

        console.error(error);

        alert("Failed to delete reel.");

      }

    }


    // Logout
    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

        window.location.href = "index.html";

      } catch (error) {

        console.error(error);

      }

    });

  </script>

</body>
</html>
